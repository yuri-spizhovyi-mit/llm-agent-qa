[pytest]
testpaths = tests
# src/ for this repo's code; the world's test helpers and services from the submodule
pythonpath = src vendor/settlement/tests vendor/settlement/services
addopts = -ra --strict-markers
timeout = 120
markers =
    req(id): requirement ID covered by the test (ENV-, TOOL-, AGT-, GOLD-, JDG-, RED-, GATE-xx)
filterwarnings =
    # third-party: web3 imports websockets.legacy; nothing in this repo uses it
    ignore:websockets.legacy is deprecated:DeprecationWarning
