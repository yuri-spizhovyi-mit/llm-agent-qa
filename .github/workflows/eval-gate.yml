name: eval-gate

# Live evals plus the regression gate (learning guide 07, GATE-D2). It costs money, so it runs
# only on demand, or when a PR changes what the model sees: the prompts or the tool definitions.
# The API key comes only from the repository secret ANTHROPIC_API_KEY. Without it the job
# reports "skipped" and passes. It is not a required check (GATE-D7).
on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Trials per task"
        default: "3"
      prompt:
        description: "Prompt version (src/agentqa/prompts/<name>.md)"
        default: "system_v1"
  pull_request:
    paths:
      - "src/agentqa/prompts/**"
      - "src/agentqa/tools.py"

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: eval gate (live)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TRIALS: ${{ inputs.trials || '3' }}
      PROMPT: ${{ inputs.prompt || 'system_v1' }}
      PYTHONPATH: src
    steps:
      - name: Is an API key configured?
        id: key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::eval gate skipped: no ANTHROPIC_API_KEY repository secret (see docs/plan.md, M8)"
          fi

      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.key.outputs.present == 'true'
        with:
          version: v1.8.7

      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install and build
        if: steps.key.outputs.present == 'true'
        run: |
          pip install -r requirements.txt
          (cd vendor/settlement/contracts && forge build)

      # The judge is measured before it grades anything (JDG-D2), once per run: it doesn't depend
      # on the agent's prompt or the trial count. An untrusted judge is a result, not a crash: the
      # golden evals then run without it, and the gate refuses to compare runs graded by different
      # judges (GATE-D4). No calibration file means the step crashed (F-09).
      #
      # Every eval step keeps the CLI's exit code: 1 is a finding (the gate decides), 3 means the
      # model calls failed and the run measured nothing (F-13), so the job fails like a crash.
      - name: Judge calibration (live)
        id: judge
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          code=0; python -m agentqa.evals.calibrate --provider live || code=$?
          test -f reports/judge/calibration.json || { echo "::error::judge calibration produced no results: the run crashed"; exit 1; }
          cat reports/judge/calibration.md >> "$GITHUB_STEP_SUMMARY"
          [ "$code" != 3 ] || { echo "::error::judge calibration measured nothing: the judge's API calls failed (F-13)"; exit 1; }
          [ "$code" = 0 ] || echo "::warning::the judge failed calibration: the golden evals run without it"
          trusted=$(python -c "import json; print(str(json.load(open('reports/judge/calibration.json')).get('trusted') is True).lower())")
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

      - name: Golden evals (live)
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JUDGE: ${{ steps.judge.outputs.trusted == 'true' && '--judge' || '' }}
        # Failing tasks are a result (the gate judges them); no results file means a crash (F-09).
        run: |
          code=0; python -m agentqa.evals --provider live --trials "$TRIALS" --prompt "$PROMPT" --traces reports/golden/traces $JUDGE || code=$?
          test -f reports/golden/results.json || { echo "::error::golden evals produced no results: the run crashed"; exit 1; }
          [ "$code" != 3 ] || { echo "::error::golden evals measured nothing: the model's API calls failed (F-13)"; exit 1; }
          [ "$code" = 0 ] || echo "::warning::golden evals reported failing tasks; the gate decides"

      - name: Red team (live)
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          code=0; python -m agentqa.evals.redteam --provider live --trials "$TRIALS" --prompt "$PROMPT" --traces reports/redteam/traces || code=$?
          test -f reports/redteam/results.json || { echo "::error::the red team produced no results: the run crashed"; exit 1; }
          [ "$code" != 3 ] || { echo "::error::the red team measured nothing: the model's API calls failed (F-13)"; exit 1; }
          [ "$code" = 0 ] || echo "::warning::the red team reported executed attacks; the gate decides"

      # The evals above report; this step decides, against evals/baseline/ (GATE-D6). That baseline
      # is graded by code only, so a golden run graded by the judge is "not comparable" (GATE-D4):
      # it becomes the next baseline candidate instead.
      - name: Regression gate
        if: steps.key.outputs.present == 'true'
        run: |
          if [ ! -f evals/baseline/golden.json ]; then
            echo "::warning::no baseline yet in evals/baseline/: this run's results can become it (M8)"
            exit 0
          fi
          python -m agentqa.evals.gate \
            --baseline evals/baseline/golden.json --candidate reports/golden/results.json \
            --redteam-baseline evals/baseline/redteam.json --redteam reports/redteam/results.json \
            --out reports/gate.md
          cat reports/gate.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: eval-reports
          path: reports/
          retention-days: 30
